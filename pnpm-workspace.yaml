packages:
  - 'packages/*'
  - 'apps/*'

allowBuilds:
  esbuild: true
  onnxruntime-node: true
  workerd: true

onlyBuiltDependencies:
  - esbuild

# pnpm 11 відхиляє пакети, опубліковані менш ніж добу тому — захист від
# компрометації акаунта супроводжувача. Екосистема Astro щойно зробила
# узгоджений реліз, тож фіксуємо найсвіжіші версії, які вже відлежались,
# замість того щоб вимикати саму політику.
overrides:
  astro: 7.2.3
  satteri: 0.10.1
