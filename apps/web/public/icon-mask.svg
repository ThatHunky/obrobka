    <pattern id="c" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#151C2F"/>
      <rect width="5" height="5" fill="#232C46"/>
      <rect x="5" y="5" width="5" height="5" fill="#232C46"/>
    </pattern>
    <clipPath id="t"><rect x="13" y="13" width="38" height="38" rx="9"/></clipPath>
