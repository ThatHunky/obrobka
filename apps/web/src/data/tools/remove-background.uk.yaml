slug: видалити-фон
locale: uk
pair: remove-background.en
title: >-
  Видалити фон із фото онлайн — безкоштовно, без завантаження на сервер
description: >-
  Приберіть фон із зображення просто в браузері. Три моделі на вибір: швидка
  для будь-яких сюжетів, портретна для людей і точна для складних країв.
h1: Видалення фону із зображення
intro: >-
  Обробка виконується у вашій вкладці — фото не надсилається на жоден сервер.
  Результат зберігається у PNG із прозорим фоном.
preset:
  width: 1024
  height: 1024
  mode: inside
  format: png
  padTransparent: true
  removeBg: true
  tier: fast
steps:
  - Оберіть зображення, перетягніть його або вставте через Ctrl+V
  - Увімкніть «Прибрати фон» — модель завантажиться один раз і залишиться в кеші
  - За потреби змініть рівень моделі й завантажте PNG
faq:
  - q: Скільки важить модель?
    a: >-
      Швидка — 4,4 МБ, портретна — 12,4 МБ, точна — 84 МБ. Перша качається
      один раз і далі береться з кеша браузера.
  - q: Чому портретна модель не працює на предметах?
    a: >-
      MODNet навчений виключно на людях. На товарі чи логотипі він поверне
      порожню маску — для таких сюжетів беріть швидку або точну модель.
  - q: Чи можна додати обведення?
    a: >-
      Так, увімкніть «Обведення» й задайте товщину та колір. Полотно
      розшириться, щоб обведення не обрізалось по краю.
