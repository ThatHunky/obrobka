title: Змінити розмір зображення онлайн — точні пікселі, без втрати пропорцій
description: >-
  Змінити розмір фото чи картинки: задайте точну ширину й висоту. П'ять режимів приведення: вписати з полями, заповнити з обрізкою, розтягнути. Обробка в браузері.
h1: Змінити розмір фото
intro: Задайте точні ширину й висоту в пікселях і оберіть, як саме зображення має вписатися в цей кадр.
preset:
  width: 1920
  height: 1080
  mode: contain
  format: png
  padTransparent: true
steps:
  - Оберіть зображення
  - Введіть потрібні ширину й висоту
  - Оберіть режим приведення та завантажте результат
faq:
  - q: Чим відрізняється «вписати» від «заповнити»?
    a: «Вписати» показує зображення цілком і доповнює кадр полями. «Заповнити» покриває весь кадр без полів, але обрізає те, що не вмістилося.
  - q: Чи можна збільшити маленьке зображення?
    a: Так, увімкніть «Дозволити збільшення». Пікселів від цього не побільшає, тож різкість впаде.
