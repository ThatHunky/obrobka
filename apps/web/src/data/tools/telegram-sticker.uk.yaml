slug: стікер-для-телеграма
locale: uk
pair: telegram-sticker.en
title: Зробити стікер для Telegram — 512×512 PNG онлайн і безкоштовно
description: >-
  Приведіть будь-яке зображення до формату стікера Telegram: PNG 512×512 з прозорим фоном. Обробка в браузері, файл не залишає пристрій.
h1: Стікер для Telegram із будь-якого зображення
intro: Telegram вимагає від стікера PNG розміром рівно 512×512 пікселів. Цей інструмент приводить зображення до потрібного розміру, зберігаючи пропорції та прозорість.
preset:
  width: 512
  height: 512
  mode: contain
  format: png
  padTransparent: true
steps:
  - Оберіть зображення або перетягніть його у вікно
  - Натисніть пресет «Стікер Telegram 512×512»
  - Завантажте готовий PNG
faq:
  - q: Чи зберігається прозорість?
    a: Так. Порожні поля лишаються повністю прозорими, а вихідний формат PNG підтримує альфа-канал.
  - q: Чи завантажується моє фото на сервер?
    a: Ні. Уся обробка виконується у вашому браузері, файл нікуди не надсилається.
  - q: Що робити, якщо зображення менше за 512 пікселів?
    a: Увімкніть «Дозволити збільшення». Якість при цьому впаде, тож краще взяти більший оригінал.
