slug: розумна-обрізка
locale: uk
pair: smart-crop.en
title: >-
  Розумна обрізка фото онлайн — кадр за суб'єктом, а не за центром
description: >-
  Обрізає зображення під потрібне співвідношення сторін так, щоб головний
  об'єкт лишився в кадрі. Працює в браузері, без завантаження на сервер.
h1: Обрізка за суб'єктом
intro: >-
  Звичайна обрізка ріже по центру й часто відтинає голову чи край товару.
  Тут кадр будується навколо того, що модель визначила як головний об'єкт.
preset:
  width: 1080
  height: 1080
  mode: cover
  format: png
  padTransparent: true
  removeBg: false
  tier: fast
steps:
  - Оберіть зображення
  - Задайте потрібне співвідношення сторін
  - Завантажте кадр, побудований навколо суб'єкта
faq:
  - q: Чи видаляється фон?
    a: >-
      Ні. Модель використовується лише щоб знайти суб'єкт, а кадр вирізається
      з оригіналу разом із фоном.
  - q: Що буде, якщо об'єктів кілька?
    a: >-
      Кадр охопить їх усі: береться прямокутник, що вміщує всю знайдену маску.
