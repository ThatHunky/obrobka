slug: heic-в-jpg
locale: uk
pair: heic-to-jpg.en
title: >-
  Конвертувати HEIC у JPG онлайн — просто у вкладці, без завантаження
description: >-
  Відкрийте фото з айфона у форматі HEIC і збережіть як JPG, PNG або WebP.
  Вертикальні знімки не лягають набік — орієнтація застосовується сама.
h1: HEIC у JPG
intro: >-
  iPhone знімає у HEIC, і половина програм такий файл не відкриває. Тут він
  розкодовується прямо у вкладці бібліотекою libheif — фото нікуди не
  надсилається. Можна кинути одразу двадцять файлів і забрати ZIP.
preset:
  width: 20000
  height: 20000
  mode: inside
  format: jpeg
  padTransparent: false
steps:
  - Оберіть файли HEIC або перетягніть їх у вікно — можна відразу кілька
  - Формат уже стоїть на JPEG; за потреби змініть якість
  - Заберіть готовий файл, а для пакета — архів ZIP
faq:
  - q: Чому фото з айфона іноді виходить набік?
    a: >-
      Бо орієнтація в JPEG і HEIC записана окремим теґом, а не в самих
      пікселях. Тут цей теґ читається й застосовується до обробки, тож
      вертикальний знімок лишається вертикальним.
  - q: Розмір змінюється?
    a: >-
      Ні. У пресеті стоїть режим «без полів» із межею, більшою за будь-яке
      фото, і збільшення вимкнено — зображення проходить у своїй роздільності.
  - q: Що стається з координатами GPS?
    a: >-
      Вони не переносяться. Зображення перемальовується з пікселів, а всі
      метадані лишаються у вхідному файлі. Що саме в ньому було, видно
      в панелі під результатом.
  - q: Чому HEIC довантажується окремо?
    a: >-
      Декодер libheif важить 1,46 МБ. Вантажити його всім, хто прийшов
      змінити розмір PNG, немає сенсу — він завантажується лише тоді,
      коли ви справді відкрили HEIC.
