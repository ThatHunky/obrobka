group: task
slug: прибрати-exif
locale: uk
pair: strip-exif.en
title: >-
  Видалити метадані з фото онлайн — EXIF і GPS, не завантажуючи його нікуди
description: >-
  Подивіться, що записано у вашому знімку: камера, дата, координати — і
  збережіть копію без жодного з цих даних. Усе відбувається у вкладці.
h1: Видалити метадані з фото
intro: >-
  Фотографія з телефона зазвичай носить у собі модель камери, час зйомки
  і точку на карті. Панель під результатом показує, що саме там є, а сам
  результат не містить нічого з цього — зображення перемальовується з нуля.
preset:
  width: 20000
  height: 20000
  mode: inside
  format: jpeg
  padTransparent: false
steps:
  - Оберіть фото — під результатом з’явиться перелік того, що в ньому записано
  - 'Перевірте, чи є там координати: вони позначені окремо'
  - Завантажте результат — у ньому метаданих уже немає
faq:
  - q: Як переконатися, що дані справді зникли?
    a: >-
      Перевірено вимірюванням: із файлу з координатами Києва після
      перекодування exifr не знаходить ані GPS, ані моделі камери, ані дати —
      ні в JPEG, ні в PNG, ні в WebP, ні в AVIF.
  - q: Якість не постраждає?
    a: >-
      Зображення перестискається, тож для JPEG варто поставити високу якість.
      Якщо потрібно зняти метадані взагалі не чіпаючи пікселів, це вміє
      MCP-інструмент strip_metadata — він працює на рівні байтів.
  - q: А профіль кольору?
    a: >-
      Профіль ICC — це не дані про вас, а опис того, як показувати кольори.
      Байтове зняття метаданих його зберігає; при перекодуванні кольори
      приводяться до звичайного sRGB.
  - q: Чи можна обробити багато файлів одразу?
    a: >-
      Так. Оберіть кілька — увімкнеться пакетний режим, і на виході буде ZIP.
